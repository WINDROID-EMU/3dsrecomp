[package]
name = "recomp-abi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The interface between the code 3dsrecomp generates and the programs that run it"

[features]
default = ["load"]
# opening libraries of recompiled code while running
load = ["dep:libloading"]

[dependencies]
libloading = { version = "0.8", optional = true }
